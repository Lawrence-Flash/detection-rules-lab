title: Linux SSH Failed Password
id: 2de4ec25-ac45-4299-ab99-14f8f1ffd4d4
status: experimental
description: |
  Matches an sshd message that records a failed password for a named account.
  One line is not a brute-force attack. It is the line a SIEM would count.
  This matcher does not aggregate, so the rule stays on a single event.
  Password spraying (T1110.003) needs many accounts and is not claimed here.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://man7.org/linux/man-pages/man8/sshd.8.html
author: Lawrence Tshabalala
date: '2026-10-28'
logsource:
  product: linux
  service: auth
  definition: sshd syslog body in message, with the process name in process.
detection:
  selection:
    process: sshd
    message|re: 'Failed password for (invalid user )?[A-Za-z0-9_.-]+ from '
  condition: selection
falsepositives:
  - A person typed the wrong password once.
  - A scanner or monitor that authenticates with a bad password on purpose.
level: low
tags:
  - attack.credential-access
  - attack.t1110.001
