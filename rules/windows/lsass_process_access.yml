title: Windows LSASS Memory Access
id: 209d53d4-e7ea-4b06-9c19-b89a824fe768
status: test
description: |
  Matches Sysmon process-access event 10 when the target is lsass.exe and
  GrantedAccess is one of 0x1010, 0x1410, 0x1438, 0x143a, or 0x1fffff.
  Those masks include process memory read or broader rights used when a
  tool dumps LSASS. That is T1003.001. A query-only mask such as 0x1000 is
  not a match. Access to any other process is not a match.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: Lawrence Tshabalala
date: '2026-10-28'
logsource:
  product: windows
  category: process_access
  definition: Sysmon event 10. SourceImage opened TargetImage with GrantedAccess.
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_source:
    SourceImage|endswith:
      - '\csrss.exe'
      - '\wininit.exe'
  condition: selection and not filter_source
falsepositives:
  - Security agents that open LSASS with a memory-read mask.
  - A credential-guard or backup component doing the same.
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
