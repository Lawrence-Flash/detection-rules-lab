title: Windows Network Logon Bad Password 4625
id: 87077593-a1f8-4b82-a575-52ee67e98c52
status: experimental
description: |
  Matches one Windows Security 4625 for a network logon (type 3) where the
  password was wrong and the account name was right (SubStatus 0xC000006A).
  Machine accounts ending in $ are excluded. One event is not a burst and
  cannot separate password guessing (T1110.001) from password spraying
  (T1110.003). Spraying needs a count of distinct accounts, which this
  matcher does not do, so only T1110.001 is tagged.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
author: Lawrence Tshabalala
date: '2026-10-28'
logsource:
  product: windows
  service: security
  definition: Security event 4625. Field names follow the event XML.
detection:
  selection:
    EventID: 4625
    LogonType: 3
    SubStatus: '0xc000006a'
  filter_machine:
    TargetUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - A user or service with a stale password.
  - A vulnerability scanner authenticating once with a wrong password.
level: low
tags:
  - attack.credential-access
  - attack.t1110.001
